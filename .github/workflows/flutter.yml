name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true
      # Gate 1: analyze TANPA warning (aturan repo: 1 warning = merah)
      - name: Analyze (zero-tolerance)
        run: |
          flutter pub get
          flutter analyze lib test
      # Gate 2: semua test hijau
      - name: Test
        run: flutter test
      # Build APK arm64 (release, unsigned)
      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: app-arm64
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
